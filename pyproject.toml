[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nao-fair-autostart"
version = "0.1.0"
description = "On-robot autostart for NAO Fair trigger assignments."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Schröter Bonk", email = "vasc9380@th-wildau.de" }]
maintainers = [{ name = "Valentin Schröter Bonk", email = "vasc9380@th-wildau.de" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["nao_fair_autostart"]
